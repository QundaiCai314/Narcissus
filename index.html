<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>XUEZI 1.1.0</title>
    <link rel="icon" type="image/png" href="./assets/xuezi-icon.png" />
    <link rel="stylesheet" href="./styles.css" />
    <link rel="stylesheet" href="./brand-theme.css" />
    <link rel="stylesheet" href="./dark-theme.css" />
  </head>
  <body>
    <div class="app-shell">
      <header class="topbar">
        <button class="brand" id="homeButton" type="button" aria-label="返回课程列表">
          <img class="brand-mark" src="./assets/xuezi-icon.png" alt="" />
          <span>
            <strong>靴子</strong>
            <small>ver.1.1.0</small>
          </span>
        </button>
        <nav class="topnav" aria-label="主导航">
          <button class="theme-toggle" id="themeToggle" type="button" aria-label="切换界面主题" title="切换界面主题">Midori</button>
          <button class="nav-button" data-view="settings" type="button">API 设置</button>
        </nav>
      </header>

      <main id="app" class="app-main"></main>
    </div>

    <template id="coursesTemplate">
      <section class="course-page">
        <div class="course-toolbar">
          <div>
            <p class="kicker">课程管理</p>
            <h1>我的课程</h1>
          </div>
          <form id="courseForm" class="course-form">
            <input id="courseName" type="text" maxlength="40" placeholder="课程名称" autocomplete="off" required />
            <button class="primary-button" type="submit">新建课程</button>
          </form>
        </div>
        <div id="courseGrid" class="course-grid"></div>
      </section>
    </template>

    <template id="workspaceTemplate">
      <section class="workspace">
        <aside class="left-panel">
          <div class="panel-head">
            <button class="icon-button" id="backButton" type="button" aria-label="返回课程列表">←</button>
            <div>
              <p class="kicker">当前课程</p>
              <h1 id="workspaceTitle"></h1>
            </div>
          </div>
          <div class="metric-list">
            <div><span>资料</span><strong id="fileCount">0</strong></div>
            <div><span>知识点</span><strong id="knowledgeCount">0</strong></div>
            <div><span>难点</span><strong id="difficultyCount">0</strong></div>
            <div><span>错题率</span><strong id="mistakeRate">0%</strong></div>
          </div>
          <label class="upload-button">
            上传文件
            <input id="fileInput" type="file" multiple accept=".txt,.md,.csv,.json,.html,.docx,.pdf,.ppt,.pptx,text/plain,text/csv,application/json,text/html,application/pdf,application/vnd.openxmlformats-officedocument.wordprocessingml.document,application/vnd.openxmlformats-officedocument.presentationml.presentation" />
          </label>
          <button class="secondary-button wide" id="parseFilesButton" type="button">解析文件</button>
          <button class="primary-button wide" id="organizeKnowledgeButton" type="button">划分知识点</button>
          <div class="parse-status" id="parseStatus" role="status">上传文件后，点击“解析文件”提取文本与原文章节；再按需选择资料和章节划分知识点。</div>
          <div class="support-note">支持 TXT、MD、CSV、JSON、HTML、Word、可提取文字的 PDF 和 PPTX；旧版 PPT 需要先另存为 PPTX。</div>
          <div class="subject-selector" id="subjectSelector">
            <div class="section-heading"><strong>解析前选择学科</strong><span>用于辅助 AI 划分知识点</span></div>
            <label>学科门类<select id="subjectCategorySelect"><option value="">请选择学科门类</option><option value="哲学">哲学</option><option value="经济学">经济学</option><option value="法学">法学</option><option value="教育学">教育学</option><option value="文学">文学</option><option value="历史学">历史学</option><option value="理学">理学</option><option value="工学">工学</option><option value="农学">农学</option><option value="医学">医学</option><option value="军事学">军事学</option><option value="管理学">管理学</option><option value="艺术学">艺术学</option><option value="交叉学科">交叉学科</option></select></label>
            <label>具体学科<select id="subjectNameSelect"><option value="" disabled selected>请先选择学科门类</option></select></label>
            <label id="customSubjectLabel">具体专业或课程（可选）<input id="customSubjectInput" type="text" maxlength="60" placeholder="例如：密码学、数据新闻学或操作系统课程" /></label>
          </div>
          <div class="upload-progress" id="uploadProgress" hidden>
            <div><span id="uploadProgressText">准备解析</span><strong id="uploadProgressValue">0%</strong></div>
            <progress id="uploadProgressBar" max="100" value="0"></progress>
          </div>
          <div class="file-list" id="fileList"></div>
        </aside>

        <section class="center-panel">
          <div class="tabbar" role="tablist" aria-label="课程工作区">
            <button class="tab active" data-tab="overview" type="button">在线阅读</button>
            <button class="tab" data-tab="files" type="button">知识点</button>
            <button class="tab" data-tab="insights" type="button">重点难点</button>
            <button class="tab" data-tab="generator" type="button">候选题</button>
            <button class="tab" data-tab="questions" type="button">题库</button>
            <button class="tab" data-tab="papers" type="button">试卷</button>
            <button class="tab" data-tab="practice" type="button">在线答题</button>
            <button class="tab" data-tab="teacher" type="button">AI老师</button>
            <button class="tab" data-tab="analytics" type="button">学习分析</button>
          </div>
          <div id="tabContent" class="tab-content"></div>
        </section>

        <aside class="right-panel">
          <div class="api-card" id="apiStatusCard"></div>
          <div class="tool-section">
            <p class="kicker">教师出题参数</p>
            <label>
              题目数量
              <input id="questionCountInput" type="number" value="6" min="1" />
            </label>
            <label>
              难度梯度
              <select id="difficultySelect">
                <option value="exam">考研/期末混合</option>
                <option value="basic">基础巩固</option>
                <option value="advanced">拔高综合</option>
              </select>
            </label>
            <label>
              题型组合
              <select id="typeSelect">
                <option value="mixed">混合题型</option>
                <option value="objective">客观题为主</option>
                <option value="subjective">主观题为主</option>
              </select>
            </label>
            <label>
              组织方式
              <select id="scopeSelect">
                <option value="auto">自动识别</option>
                <option value="knowledge">按知识点</option>
                <option value="chapter">按章节</option>
                <option value="theme">按主题</option>
                <option value="reader_pages">在线阅读选页</option>
              </select>
            </label>
            <label class="fast-generation-toggle" for="fastGenerationInput">
              <span class="fast-generation-copy">
                <strong>快速出题</strong>
                <small>跳过 AI 二次审查，保留基础格式与来源检查</small>
              </span>
              <span class="toggle-track">
                <input id="fastGenerationInput" type="checkbox" />
                <span aria-hidden="true"></span>
              </span>
            </label>
            <button class="primary-button wide" id="generateButton" type="button">生成候选题</button>
            <div class="generation-progress" id="generationProgress" hidden>
              <div><span id="generationProgressText">准备生成</span><strong id="generationProgressValue">0%</strong></div>
              <progress id="generationProgressBar" max="100" value="0"></progress>
            </div>
          </div>
        </aside>
      </section>
    </template>

    <template id="settingsTemplate">
      <section class="settings-page">
        <button class="secondary-button back-settings-button" id="backToWorkspace" type="button">返回工作台</button>
        <div class="settings-head">
          <p class="kicker">API 接入</p>
          <h1>OpenAI-compatible API 设置</h1>
        </div>
        <div class="api-guide">
          <strong>这里是 AI 出题的接入口</strong>
          <p>填写模型 API 后可完成知识点划分、出题、批改和 AI 老师问答。学习资料检索使用独立的真实搜索链路；可选填写 Tavily Search API Key，进一步提升网站、论文和专著的检索覆盖率。</p>
        </div>
        <form id="settingsForm" class="settings-form">
          <label>
            API 地址
            <input id="apiBase" type="url" placeholder="DeepSeek: https://api.deepseek.com 或 OpenAI: https://api.openai.com/v1" />
          </label>
          <label>
            API Key
            <input id="apiKey" type="password" placeholder="sk-..." />
          </label>
          <label>
            模型名称
            <input id="modelName" type="text" placeholder="deepseek-chat 或 gpt-4.1-mini" />
          </label>
          <label>
            联网检索 API Key（可选）
            <input id="searchApiKey" type="password" placeholder="Tavily API Key，用于增强网站、论文和专著检索" autocomplete="off" />
            <span class="support-note">不填写也可检索哔哩哔哩视频和 DOI 文献；填写后由专业搜索 API 提供候选页面，本地服务仍会逐条验证链接。</span>
          </label>
          <div class="settings-actions">
            <button class="primary-button" type="submit">保存 API 设置</button>
            <button class="danger-button" id="clearData" type="button">清空本地数据</button>
          </div>
        </form>
        <div class="storage-note">
          <strong>本地保存</strong>
          <p>课程、资料、题库和 API 配置保存在当前浏览器 localStorage。第一版不包含登录、云同步或多人协作。</p>
        </div>
      </section>
    </template>

    <script>
      window.module = undefined;
      window.exports = undefined;
      window.define = undefined;
    </script>
    <script src="./vendor/mammoth.browser.min.js"></script>
    <script src="./vendor/pdf.min.js"></script>
    <script src="./vendor/tesseract/tesseract.min.js"></script>
    <script>
      window.MathJax = {
        tex: {
          inlineMath: [["$", "$"], ["\\(", "\\)"]],
          displayMath: [["$$", "$$"], ["\\[", "\\]"]],
          processEscapes: true
        },
        svg: { fontCache: "global" },
        options: { skipHtmlTags: ["script", "noscript", "style", "textarea", "pre", "code"] }
      };
    </script>
    <script src="./vendor/mathjax/tex-svg.js"></script>
    <script src="./vendor/jszip.min.js"></script>
    <script src="./app.js"></script>
  </body>
</html>
