name: ${COMPOSE_PROJECT_NAME:-narcissus}
x-backend: &backend
  build: ./backend
  env_file: .env
  environment: &backend-env
    DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-narcissus}:${POSTGRES_PASSWORD:-narcissus_dev_password}@db:5432/${POSTGRES_DB:-narcissus}
    REDIS_URL: redis://:${REDIS_PASSWORD:-narcissus_dev_redis}@redis:6379/0
    S3_ENDPOINT: ${S3_ENDPOINT:-http://minio:9000}
    S3_ACCESS_KEY: ${S3_ACCESS_KEY:-narcissus_dev}
    S3_SECRET_KEY: ${S3_SECRET_KEY:-narcissus_dev_password}
  restart: unless-stopped
  init: true
  depends_on:
    migrate:
      condition: service_completed_successfully
    redis:
      condition: service_healthy
    minio:
      condition: service_healthy
services:
  db:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-narcissus}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-narcissus_dev_password}
      POSTGRES_DB: ${POSTGRES_DB:-narcissus}
    volumes: [postgres-data:/var/lib/postgresql/data]
    healthcheck:
      test: [CMD-SHELL, 'pg_isready -U "$${POSTGRES_USER}" -d "$${POSTGRES_DB}"']
      interval: 5s
      timeout: 5s
      retries: 20
    restart: unless-stopped
  redis:
    image: redis:7.4-alpine
    command: [redis-server, --appendonly, 'yes', --requirepass, '${REDIS_PASSWORD:-narcissus_dev_redis}']
    environment:
      REDISCLI_AUTH: ${REDIS_PASSWORD:-narcissus_dev_redis}
    volumes: [redis-data:/data]
    healthcheck:
      test: [CMD, redis-cli, ping]
      interval: 5s
      timeout: 3s
      retries: 20
    restart: unless-stopped
  minio:
    image: ${MINIO_IMAGE:-quay.io/minio/minio:RELEASE.2025-06-13T11-33-47Z}
    command: server /data --console-address :9001
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-narcissus_dev}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-narcissus_dev_password}
    volumes: [minio-data:/data]
    healthcheck:
      test: [CMD, curl, -f, http://localhost:9000/minio/health/live]
      interval: 5s
      timeout: 5s
      retries: 20
    restart: unless-stopped
  migrate:
    build: ./backend
    env_file: .env
    environment: *backend-env
    command: alembic upgrade head
    depends_on:
      db:
        condition: service_healthy
    restart: 'no'
  api:
    <<: *backend
    healthcheck:
      test: [CMD, python, -c, "import urllib.request; urllib.request.urlopen('http://localhost:8000/api/ready')"]
      interval: 10s
      timeout: 5s
      retries: 10
  worker:
    <<: *backend
    command: celery -A app.tasks.celery worker --loglevel=INFO --concurrency=2
    stop_grace_period: 300s
  beat:
    <<: *backend
    command: celery -A app.tasks.celery beat --loglevel=INFO --schedule=/tmp/celerybeat-schedule
  web:
    build: ./frontend
    environment:
      BACKEND_URL: http://api:8000
      BACKEND_REQUEST_MARKER: ${BACKEND_REQUEST_MARKER:-narcissus}
    ports: ['${WEB_BIND:-127.0.0.1}:${WEB_PORT:-3000}:3000']
    depends_on:
      api:
        condition: service_healthy
    restart: unless-stopped
    init: true
volumes:
  postgres-data:
  redis-data:
  minio-data:
